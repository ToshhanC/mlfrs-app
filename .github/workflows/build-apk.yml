name: Build MLFRS APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key (kept as a repository secret)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KEYSTORE_B64 and KS_PASS secrets (Settings > Secrets and variables > Actions), then run this workflow again."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Build release APK
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias mlfrs \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out MLFRS.apk aligned.apk
          "$BT/apksigner" verify --print-certs MLFRS.apk

      - name: Upload APK (Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: MLFRS-APK
          path: MLFRS.apk

      - name: Publish APK (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" MLFRS.apk \
            --title "MLFRS app build ${{ github.run_number }}" \
            --notes "Install MLFRS.apk on Android. The app opens https://fault-summary.netlify.app, so site updates show automatically."
